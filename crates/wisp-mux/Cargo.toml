[package]
name = "wisp-mux"
version = "6.0.0"
license = "MIT"
description = "A library for easily creating Wisp servers and clients."
homepage = "https://github.com/MercuryWorkshop/epoxy-tls/tree/multiplexed/wisp"
repository = "https://github.com/MercuryWorkshop/epoxy-tls/tree/multiplexed/wisp"
readme = "README.md"
edition = "2024"
keywords = ["websocket", "wisp", "multiplexor", "multiplexing", "stream"]
categories = ["network-programming", "asynchronous", "web-programming::websocket", "wasm"]

[dependencies]
async-trait = "0.1.89"
bitflags = { version = "2.11.1", optional = true }
bytes = "1.11.1"
ed25519 = { version = "3.0.0", optional = true }
embedded-io-async = { version = "0.7.0", optional = true }
embedded-nal-async = { version = "0.9.0", optional = true }
flume = "0.12.0"
futures = { version = "0.3.32", default-features = false, features = ["std", "async-await"] }
getrandom = { version = "0.4.2", optional = true }
num_enum = "0.7.6"
pin-project = "1.1.13"
rustc-hash = "2.1.2"
slab = "0.4.12"
thiserror = "2.0.18"
tokio = { version = "1.52.3", optional = true }
tokio-tungstenite = { version = "0.29.0", features = ["stream"], optional = true, default-features = false }
tokio-websockets = { version = "0.13.2", optional = true }

[features]
default = ["certificate"]
certificate = ["dep:getrandom", "dep:ed25519", "dep:bitflags"]
wasm = ["getrandom/wasm_js"]
tokio-websockets = ["dep:tokio-websockets", "dep:tokio"]
tokio-tungstenite = ["dep:tokio-tungstenite", "dep:tokio"]
embedded-io-async = ["dep:embedded-io-async","embedded-io-async/std"]
embedded-nal-async = ["dep:embedded-nal-async","embedded-io-async"]

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt", "time"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
