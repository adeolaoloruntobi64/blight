[package]
name = "wsproxy-tower-axum"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", default-features = false }
bytes = "1.11.1"
common = { path = "../common" }
futures-util = "0.3.32"
http-body-util = "0.1.3"
tokio = { version = "1.52.3", features = ["macros"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
tokio-websockets = { version = "0.13.3", features = ["server", "sha1_smol"] }
tokio-websockets-axum = { path = "../tokio-websockets-axum/" }
tower = "0.5.3"
tracing = "0.1.44"
