[package]
name = "vanguard"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
adblock = { version = "0.13.2", features = ["css-validation", "content-blocking", "resource-assembler"] }
base64 = "0.22"
memchr = "2.8"
js-sys = "0.3.98"
regex = "1.12"
rmp-serde = "1.3.1"
serde-wasm-bindgen = "0.6.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
talc = { version = "5.0.3", default-features = false }
wasm-bindgen = "0.2.121"
wildmatch = "2.6.1"

[package.metadata.wasm-pack.profile.release.wasm-bindgen]
omit-default-module-path = true

[package.metadata.wasm-pack.profile.dev.wasm-bindgen]
omit-default-module-path = true

[package.metadata.wasm-pack.profile.profiling.wasm-bindgen]
omit-default-module-path = true

[package.metadata.wasm-pack.profile.dev]
wasm-opt = ['--enable-simd', '--enable-threads', '--enable-nontrapping-float-to-int', '--enable-bulk-memory']

[package.metadata.wasm-pack.profile.profiling]
wasm-opt = ['--enable-simd', '--enable-threads', '--enable-nontrapping-float-to-int', '--enable-bulk-memory']

[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O4', '--enable-simd', '--enable-threads', '--enable-nontrapping-float-to-int', '--enable-bulk-memory']
